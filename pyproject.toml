[project]
name = "dart3s-comfy"
version = "0.1.0"
description = "Local Pixal3D and Trellis2 generation through Comfy CLI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cli = ["comfy-cli==1.22.0"]
media = ["numpy>=1.26", "Pillow>=10", "scipy>=1.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dart3s*", "Details3D*"]
